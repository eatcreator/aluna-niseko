<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>社内資料 | EAT CREATOR</title>
<style>
  :root { --ink:#24372f; --accent:#486552; --line:#c6d0c2; --paper:#faf8f0; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); font-family:"Hiragino Mincho ProN","Yu Mincho",serif; background:linear-gradient(135deg,#faf8f0 0 64%,#e2e8db 64%); }
  header { border-bottom:1px solid var(--line); padding:27px max(24px,6vw); font:700 15px Arial,sans-serif; letter-spacing:.2em; }
  main { max-width:1180px; width:calc(100% - 48px); margin:auto; padding:clamp(46px,7vw,94px) 0 78px; min-height:calc(100vh - 73px); }
  h1 { font-size:clamp(38px,6vw,76px); font-weight:500; letter-spacing:.08em; margin:0 0 42px; }
  section + section { margin-top:38px; }
  h2 { font-size:22px; margin:0 0 15px; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(8px,2vw,18px); }
  .card { display:flex; flex-direction:column; justify-content:space-between; gap:18px; min-height:145px; padding:clamp(12px,2.7vw,30px); color:inherit; background:var(--paper); border:1px solid var(--line); text-decoration:none; }
  .card:hover,.card:focus-visible { border-color:var(--accent); box-shadow:0 8px 22px #24372f16; }
  .card h3 { margin:0 0 8px; line-height:1.45; font-size:clamp(16px,2.65vw,25px); }
  .card p { margin:0; color:#46594e; font-size:clamp(12px,1.5vw,15px); line-height:1.65; }
  .arrow { align-self:flex-end; color:var(--accent); font:700 15px Arial,sans-serif; }
  @media(max-width:480px) {
    main { width:calc(100% - 28px); }
    header { padding-inline:14px; }
    h1 { margin-bottom:28px; }
    .card { min-height:128px; }
  }
</style>
</head>
<body>
<header>EAT CREATOR</header>
<main>
  <h1>社内資料</h1>
  <section aria-labelledby="niseko">
    <h2 id="niseko">ニセコ</h2>
    <div class="grid">
      <a class="card" href="../travel-agency/">
        <div><h3>旅行代理店向け資料</h3><p>ALUNAの宿泊と食事</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="card" href="../action-plan/">
        <div><h3>Ly アクションプラン</h3><p>社長向け改訂版</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </section>
  <section aria-labelledby="chefs">
    <h2 id="chefs">シェフ紹介</h2>
    <div class="grid">
      <a class="card" href="https://eatcreator.github.io/chef-profiles/">
        <div><h3>大山 恵介</h3><p>シェフプロフィール</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="card" href="https://eatcreator.github.io/chef-profiles/nishi.html">
        <div><h3>西 恭平</h3><p>シェフプロフィール</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </section>
</main>
</body>
</html>
